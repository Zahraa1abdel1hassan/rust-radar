name: Daily Digest

on:
  schedule:
    # 08:00 UTC daily — adjust to your community's timezone
    # Convert: e.g. 08:00 EST = 13:00 UTC → '0 13 * * *'
    - cron: '0 8 * * *'
  # Allow manual trigger from the Actions tab
  workflow_dispatch:

jobs:
  digest:
    name: Post top-3 digest to Discord & Slack
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 2. Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scraper/requirements.txt

      # 3. Install notify deps (only requests needed for webhooks)
      - name: Install dependencies
        run: pip install requests

      # 4. Post digest
      #    Secrets: DISCORD_WEBHOOK_URL and/or SLACK_WEBHOOK_URL
      #    Add these at: Settings → Secrets and variables → Actions
      - name: Post digest
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL:   ${{ secrets.SLACK_WEBHOOK_URL }}
          DIGEST_TOP_N:        "3"
          DIGEST_NICHE:        "Rust"
        run: python notify/post_digest.py
